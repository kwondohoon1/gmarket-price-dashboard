<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>데스크탑 가격비교</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --bg: #f4f3ef; --card: #ffffff; --line: #e5e2db; --soft: #f0ede6;
    --text: #24221d; --muted: #7a766c; --faint: #a5a093;
    --ok: #23795a; --ok-dark: #185940; --ok-deep: #12382a; --ok-soft: #e7f2ec;
    --bad: #b3382c; --bad-soft: #faeceb; --warn: #a96b1f; --warn-soft: #fdf0dc;
    --shadow: 0 1px 3px rgba(28, 25, 18, 0.06);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "IBM Plex Sans KR", "Malgun Gothic", system-ui, sans-serif; display: flex; }
  a { color: var(--ok); text-decoration: none; }
  a:hover { color: var(--ok-dark); text-decoration: underline; }

  /* ── 왼쪽 탭 */
  #side {
    width: 216px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--line);
    padding: 20px 12px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
  }
  .brand { padding: 6px 12px 18px; }
  .brand-name { font-size: 16px; font-weight: 700; }
  .brand-sub { font-size: 12px; color: var(--muted); }
  #tabs { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
  #tabs button {
    border: 0; background: transparent; color: #55524a; font: inherit; font-size: 14px;
    text-align: left; padding: 10px 12px; border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  #tabs button:hover { background: var(--soft); }
  #tabs button.on { background: var(--ok-soft); color: var(--ok-dark); font-weight: 600; }
  #tabs .count { font-size: 11.5px; color: var(--faint); font-weight: 400; }
  #tabs button.on .count { color: var(--ok); }
  .side-foot { font-size: 11.5px; color: var(--faint); padding: 12px 12px 0; border-top: 1px solid var(--soft); line-height: 1.6; }

  /* ── 본문 */
  main { flex-grow: 1; min-width: 0; padding: 26px 30px 50px; }
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { margin: 0; font-size: 21px; font-weight: 700; }
  .page-sub { margin-top: 4px; font-size: 13px; color: var(--muted); }
  section[hidden] { display: none; }

  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; box-shadow: var(--shadow); }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat b { display: block; font-size: 28px; font-weight: 700; margin: 2px 0; }
  .stat .sub { font-size: 12px; color: var(--faint); }
  .stat.good b { color: var(--ok); }
  .stat.risk b { color: var(--bad); }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .chip-btn { border: 1px solid #d8d4ca; background: var(--card); color: #55524a; font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  .chip-btn.on { background: #24221d; border-color: #24221d; color: #ffffff; font-weight: 600; }
  .controls input, .controls select { font: inherit; font-size: 13px; padding: 8px 12px; border: 1px solid #d8d4ca; border-radius: 10px; background: var(--card); color: var(--text); }

  /* ── 상품 카드 */
  .plist { display: flex; flex-direction: column; gap: 10px; }
  .pcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .pcard-main { display: flex; align-items: center; gap: 18px; padding: 15px 20px; cursor: pointer; }
  .pcard-main:hover { background: #fcfbf9; }
  .pcard.open .pcard-main { background: #f6faf8; }
  .p-info { flex: 1 1 auto; min-width: 0; }
  .p-title { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .p-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .chip { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; background: var(--soft); color: #55524a; }
  .chip.gpu { background: var(--ok-soft); color: var(--ok-dark); font-weight: 600; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .p-side { flex: 0 0 auto; text-align: right; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
  .p-price { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  .p-meta { font-size: 11.5px; color: var(--faint); }
  .verdict { font-size: 12.5px; font-weight: 600; padding: 3px 11px; border-radius: 999px; }
  .verdict.best { background: var(--ok-soft); color: var(--ok-dark); }
  .verdict.behind { background: var(--bad-soft); color: var(--bad); }
  .verdict.none { background: var(--soft); color: var(--muted); font-weight: 500; }
  .caret { flex: 0 0 auto; color: var(--faint); font-size: 11px; transition: transform 0.15s; }
  .pcard.open .caret { transform: rotate(180deg); }

  .rivals { border-top: 1px solid var(--soft); background: #fbfaf7; padding: 6px 20px 14px; }
  .rivals-note { font-size: 11.5px; color: var(--faint); padding: 8px 2px 6px; }
  .rrow { display: flex; align-items: center; gap: 14px; padding: 9px 10px; border-radius: 10px; }
  .rrow + .rrow { margin-top: 2px; }
  .rrow.ours { background: var(--ok-soft); }
  .r-rank { flex: 0 0 34px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--soft); border-radius: 8px; }
  .rrow:first-child .r-rank { background: #24221d; color: #ffffff; }
  .rrow.ours .r-rank { background: var(--ok); color: #ffffff; }
  .r-info { flex: 1 1 auto; min-width: 0; }
  .r-seller { font-size: 13px; font-weight: 700; }
  .rrow.ours .r-seller { color: var(--ok-dark); }
  .r-name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .r-sales { flex: 0 0 auto; text-align: right; font-size: 11.5px; color: var(--muted); line-height: 1.45; }
  .r-price { flex: 0 0 128px; text-align: right; }
  .r-price b { font-size: 14.5px; font-weight: 700; }
  .r-diff { display: block; font-size: 11.5px; font-weight: 600; }
  .r-diff.cheap { color: var(--bad); }
  .r-diff.exp { color: var(--ok); }
  .r-diff.same { color: var(--muted); font-weight: 500; }

  /* ── 표 */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--soft); white-space: nowrap; }
  td.pname { white-space: normal; min-width: 240px; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; background: #fcfbf9; position: sticky; top: 0; z-index: 1; }
  tbody tr:last-child td { border-bottom: 0; }
  th.num, td.num { text-align: right; }
  tr.hansung td { background: var(--ok-soft); }
  tr.hansung td:first-child { border-left: 3px solid var(--ok); }
  .up { color: var(--ok); } .down { color: var(--bad); } .mute { color: var(--faint); }
  /* 표 칸의 둘째 줄(가격·요일). display:block 이 없으면 대수와 금액이 한 줄에 붙어 버린다 */
  .subline { display: block; color: var(--faint); font-size: 11px; font-weight: 400; margin-top: 2px; }
  .cellnum { font-weight: 600; }          /* 판매 대수 — 진하게 */
  .cellnum.zero { font-weight: 400; color: var(--faint); }
  td .subline { white-space: nowrap; }
  .newbadge { font-size: 11px; color: var(--warn); font-weight: 600; }
  .panel-title { font-size: 14px; font-weight: 700; padding: 12px 14px 10px; border-bottom: 1px solid var(--soft); }
  .panel-title .mute { font-weight: 400; font-size: 12px; }
  .empty { text-align: center; color: var(--faint); padding: 40px 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

  /* ── 잠금 화면 */
  #lock { position: fixed; inset: 0; background: var(--ok-deep); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  /* hidden 속성만으로는 안 숨는다 — 위의 display:flex 가 이겨서 창이 계속 떠 있었다 */
  #lock[hidden] { display: none; }
  #lock .box { background: var(--card); border-radius: 16px; padding: 30px 32px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  #lock h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  #lock p { margin: 0 0 18px; font-size: 13px; color: var(--muted); }
  #lock input { width: 100%; font: inherit; font-size: 15px; padding: 11px 14px; border: 1px solid #d8d4ca; border-radius: 10px; }
  #lock button { width: 100%; margin-top: 10px; font: inherit; font-size: 15px; font-weight: 600; padding: 11px; border: 0; border-radius: 10px; background: var(--ok); color: #fff; cursor: pointer; }
  #lock button:hover { background: var(--ok-dark); }
  #lock .err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .loading { text-align: center; color: var(--muted); padding: 80px 0; }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    #side { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; gap: 6px; padding: 10px; overflow-x: auto; }
    .brand, .side-foot { display: none; }
    #tabs { flex-direction: row; }
    #tabs button { white-space: nowrap; }
    main { padding: 18px 14px 40px; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pcard-main { flex-wrap: wrap; gap: 10px; }
    .p-side { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; }
    .r-sales { display: none; }
  }
</style>
</head>
<body>

<aside id="side">
  <div class="brand">
    <div class="brand-name">데스크탑 가격비교</div>
    <div class="brand-sub">지마켓 조립PC</div>
  </div>
  <nav id="tabs">
    <button data-tab="home" class="on">현황</button>
    <button data-tab="pairs">가격 비교 <span class="count" id="cntPairs"></span></button>
    <button data-tab="rank">판매 순위 <span class="count" id="cntRank"></span></button>
  </nav>
  <div class="side-foot" id="sideFoot"></div>
</aside>

<main>
  <div id="app" class="loading">데이터를 불러오는 중이에요…</div>
</main>

<div id="lock" hidden>
  <div class="box">
    <h2>비밀번호를 입력해 주세요</h2>
    <p>데스크탑 가격비교 — 사내 열람용이에요.</p>
    <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" />
    <button id="unlock">열기</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, children = []) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const c of [].concat(children)) node.append(c);
  return node;
};
const won = (n) => (n == null ? "-" : n.toLocaleString("ko-KR") + "원");
const num = (n) => (n == null ? "-" : Number(n).toLocaleString("ko-KR"));
const md = (d) => String(d || "").slice(5).replace("-", "/");
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const dow = (d) => (d ? DOW[new Date(d + "T00:00:00Z").getUTCDay()] : "");
const BRAND_NAME = { ihansung: "한성컴퓨터", perflab: "퍼플랩", CYNEX1314: "씨넥스", assacom2: "아싸컴", preflow01: "프리플로우", seorincni: "서린씨앤아이" };
const seller = (k) => BRAND_NAME[k] || k || "-";
const gpuText = (spec) => {
  if (!spec.gpu) return null;
  if (spec.gpu === "IGPU") return "내장그래픽";
  return spec.gpu.replace(/^NV-/, "RTX ").replace(/^AMD-/, "RX ") + (spec.vram ? " " + spec.vram + "GB" : "");
};

let DATA = null;
let ready = false; // 데이터를 받아 잠금 해제 준비가 끝났는지
// 데이터가 오기 전에 눌러도 아무 일도 없는 것처럼 보이지 않게, 처음부터 안내를 달아 둔다
document.getElementById("unlock").onclick = () => {
  if (!ready) document.getElementById("lockErr").textContent = "데이터를 불러오는 중이에요 — 잠시 뒤 다시 눌러 주세요";
};
let tab = "home";
let filterMode = "all";
let expanded = null;
let rankQuery = "";
let rankOursOnly = false;

/* 브라우저 저장소가 막혀 있어도 화면이 죽지 않게 감싼다 */
function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function safeDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

/* 어디서든 오류가 나면 조용히 멈추지 말고 화면에 보여준다 */
window.onerror = function (msg) {
  const box = document.getElementById("lockErr");
  if (box && !document.getElementById("lock").hidden) box.textContent = "문제가 생겼어요: " + msg;
};

/* ── 잠금 해제 (AES-GCM, 비밀번호에서 열쇠를 만든다) */
function b64(s) {
  const bin = atob(s);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}
async function decryptPayload(payload, password) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(payload.kdf.salt), iterations: payload.kdf.iterations, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(payload.iv) }, key, b64(payload.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

/* ── 탭 */
for (const btn of document.querySelectorAll("#tabs button")) {
  btn.onclick = () => {
    tab = btn.dataset.tab;
    for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b === btn);
    render();
  };
}

function salesLines(m) {
  const dates = DATA.pairs.salesDates || [];
  const daily = dates.map((d) => (m.dailySales ? m.dailySales[d] : null));
  const cumulative = m.salesCount == null ? m.popSales : m.salesCount;
  const lines = [];
  if (daily.some((v) => v != null)) lines.push("최근 판매 " + daily.map((v) => (v == null ? "·" : num(v))).join(" · ") + "대");
  if (cumulative != null) lines.push("누적 " + num(cumulative) + "대");
  return lines;
}

function verdictOf(i) {
  if (!i.matchCount) return { cls: "none", text: "비교할 경쟁 상품 없음" };
  if (i.rank === 1) return { cls: "best", text: "최저가 · " + i.rankOf + "곳 중 1위" };
  if (i.diffToMin > 0) return { cls: "behind", text: i.rankOf + "곳 중 " + i.rank + "위 · 최저가보다 " + num(i.diffToMin) + "원 비쌈" };
  return { cls: "best", text: i.rankOf + "곳 중 " + i.rank + "위" };
}

function rivalList(item) {
  const ourRow = { ours: true, title: item.title.replace("[한성컴퓨터]", "").trim(), price: item.price, salesCount: item.salesCount, popSales: item.popSales };
  const rows = [ourRow, ...item.matches].sort((a, b) => (a.price == null ? Infinity : a.price) - (b.price == null ? Infinity : b.price));
  const dates = DATA.pairs.salesDates || [];
  return el("div", { className: "rivals" }, [
    el("div", { className: "rivals-note", textContent: "같은 스펙 " + rows.length + "개 상품 — 싼 순서" + (dates.length ? " · 최근 판매는 " + dates.map(md).join("→") + " 사이 판 대수 (경쟁 상품만)" : "") }),
    ...rows.map((m, idx) => {
      const diffEl = m.ours
        ? el("span", { className: "r-diff same", textContent: "우리 판매가" })
        : m.diff == null ? el("span", { className: "r-diff same", textContent: "" })
        : m.diff === 0 ? el("span", { className: "r-diff same", textContent: "같은 가격" })
        : m.diff > 0 ? el("span", { className: "r-diff cheap", textContent: "한성보다 " + num(m.diff) + "원 쌈" })
        : el("span", { className: "r-diff exp", textContent: "한성보다 " + num(-m.diff) + "원 비쌈" });
      const lines = m.ours
        ? ((m.salesCount != null || m.popSales != null) ? ["누적 " + num(m.salesCount != null ? m.salesCount : m.popSales) + "대"] : [])
        : salesLines(m);
      return el("div", { className: "rrow" + (m.ours ? " ours" : "") }, [
        el("div", { className: "r-rank", textContent: m.price == null ? "-" : (idx + 1) + "위" }),
        el("div", { className: "r-info" }, [
          el("div", { className: "r-seller" }, [
            document.createTextNode(m.ours ? "한성컴퓨터" : seller(m.brandKey)),
            ...(m.specChanged ? [el("span", { className: "chip warn", style: "margin-left:6px", textContent: "스펙 변경" })] : []),
            ...(!m.ours && m.vramUnknown ? [el("span", { className: "chip", style: "margin-left:6px", textContent: "그래픽 메모리 확인 필요" })] : []),
          ]),
          m.ours ? el("div", { className: "r-name", textContent: m.title })
                 : el("div", { className: "r-name" }, el("a", { href: m.url, target: "_blank", rel: "noreferrer", textContent: m.title })),
        ]),
        el("div", { className: "r-sales" }, lines.map((t) => el("div", { textContent: t }))),
        el("div", { className: "r-price" }, [el("b", { textContent: won(m.price) }), diffEl]),
      ]);
    }),
  ]);
}

function productCard(i) {
  const v = verdictOf(i);
  const card = el("div", { className: "pcard" + (i.goodsCode === expanded ? " open" : "") });
  const chips = [
    i.spec.cpu ? el("span", { className: "chip", textContent: i.spec.cpu.replace(/^(AMD|INTEL)-/, "") }) : null,
    gpuText(i.spec) ? el("span", { className: "chip gpu", textContent: gpuText(i.spec) }) : null,
    i.spec.ram ? el("span", { className: "chip", textContent: "램 " + i.spec.ram + "GB" }) : null,
    i.spec.storage ? el("span", { className: "chip", textContent: "저장 " + i.spec.storage + "GB" }) : null,
    i.specChanged ? el("span", { className: "chip warn", textContent: "스펙 변경" }) : null,
  ].filter(Boolean);
  const meta = [
    i.popRank != null ? "인기 " + i.popRank + "위" : null,
    (i.salesCount != null || i.popSales != null) ? "누적 판매 " + num(i.salesCount != null ? i.salesCount : i.popSales) : null,
  ].filter(Boolean).join(" · ");

  const main = el("div", { className: "pcard-main" }, [
    el("div", { className: "p-info" }, [
      el("div", { className: "p-title", textContent: i.title.replace("[한성컴퓨터]", "").trim() }),
      el("div", { className: "p-chips" }, chips),
    ]),
    el("div", { className: "p-side" }, [
      el("div", { className: "p-price", textContent: won(i.price) }),
      el("span", { className: "verdict " + v.cls, textContent: v.text }),
      meta ? el("div", { className: "p-meta", textContent: meta }) : el("span"),
    ]),
    el("div", { className: "caret", textContent: "▼" }),
  ]);
  main.onclick = () => { expanded = expanded === i.goodsCode ? null : i.goodsCode; renderPairList(); };
  card.append(main);
  if (i.goodsCode === expanded) card.append(rivalList(i));
  return card;
}

function pairRows() {
  const q = ($("#searchBox") ? $("#searchBox").value : "").trim().toLowerCase();
  let rows = DATA.pairs.items.filter((i) => {
    if (filterMode === "best" && i.rank !== 1) return false;
    if (filterMode === "behind" && !(i.diffToMin > 0)) return false;
    return !q || i.title.toLowerCase().includes(q);
  });
  const sort = $("#sortBox") ? $("#sortBox").value : "risk";
  rows = [...rows];
  if (sort === "risk") rows.sort((a, b) => (b.diffToMin == null ? -Infinity : b.diffToMin) - (a.diffToMin == null ? -Infinity : a.diffToMin));
  else if (sort === "pop") rows.sort((a, b) => (a.popRank == null ? Infinity : a.popRank) - (b.popRank == null ? Infinity : b.popRank));
  else if (sort === "price") rows.sort((a, b) => (a.price == null ? Infinity : a.price) - (b.price == null ? Infinity : b.price));
  return rows;
}

function renderPairList() {
  const rows = pairRows();
  $("#plist").replaceChildren(...(rows.length ? rows.map(productCard) : [el("div", { className: "empty", textContent: "조건에 맞는 상품이 없어요" })]));
  for (const [k, id] of [["all", "fAll"], ["best", "fBest"], ["behind", "fBehind"]]) {
    if ($("#" + id)) $("#" + id).className = "chip-btn" + (filterMode === k ? " on" : "");
  }
}

let salesMode = "hour";      // hour = 시간대별, day = 일자별
let salesDate = "";          // 시간대별에서 보고 있는 날짜
let salesBrand = "";
let salesQuery = "";

/** 지금 보고 있는 표 (시간대별이면 그 날짜의 것) */
function salesTable() {
  const s = DATA.sales;
  if (!s) return null;
  if (salesMode === "day") return s.daily;
  if (!salesDate) salesDate = (s.hourlyDates || [])[(s.hourlyDates || []).length - 1] || "";
  return s.hourly ? s.hourly[salesDate] : null;
}

function salesRows(t) {
  // 순위는 필터와 무관하게 합계 기준으로 먼저 매긴다 (필터를 걸어도 번호가 흔들리지 않게)
  const ranked = (t.rows || []).map((r, i) => ({ r: r, no: i + 1 }));
  return ranked.filter(function (x) {
    if (salesBrand && (x.r.brand || "") !== salesBrand) return false;
    if (!salesQuery) return true;
    return ((x.r.title || "") + " " + (x.r.brand || "")).toLowerCase().indexOf(salesQuery) !== -1;
  });
}

function renderSalesTable() {
  const t = salesTable();
  if (!t) return;
  const cols = t.columns || [];
  const rows = salesRows(t);
  const hour = salesMode === "hour";

  $("#salesMeta").textContent = hour
    ? t.date + " · 상품 " + rows.length + "개 · 시간대별 판매 대수 (" + cols.length + "회 수집)"
    : t.from + " ~ " + t.to + " · 상품 " + rows.length + "개 · 합계 기준 순위";

  $("#salesHead").replaceChildren(el("tr", {}, [
    el("th", { textContent: "순위" }),
    el("th", { textContent: "브랜드" }),
    el("th", { className: "pname", textContent: "상품명" }),
    ...cols.map((c) => el("th", { className: "num" }, [
      document.createTextNode(c.label),
      c.sub ? el("span", { className: "subline", textContent: c.sub }) : el("span"),
    ])),
    el("th", { className: "num", textContent: hour ? "하루 판매" : "합계" }),
  ]));

  $("#salesBody").replaceChildren(...(rows.length ? rows.map(function (x) {
    const r = x.r;
    const isHansung = /한성/.test(r.brand || "");
    return el("tr", { className: isHansung ? "hansung" : "" }, [
      el("td", { className: "num", textContent: String(x.no) }),
      el("td", { textContent: r.brand || "-", className: r.brand ? "" : "mute" }),
      el("td", { className: "pname" }, el("a", { href: r.url, target: "_blank", rel: "noreferrer", textContent: r.title || "(상품명 없음)" })),
      ...cols.map(function (c) {
        const cell = r.cells ? r.cells[c.key] : null;
        if (!cell) return el("td", { className: "num mute", textContent: "—" });
        if (hour) {
          // 누적 대수와 직전 수집 대비 증가분, 그 아래 그때 가격
          const box = el("td", { className: "num" }, [
            el("div", { className: "cellnum" }, [
              document.createTextNode(cell.cumulative == null ? "-" : num(cell.cumulative) + "대"),
              cell.sold == null ? el("span") : el("span", {
                className: cell.sold > 0 ? "up" : "mute",
                textContent: " (" + (cell.sold > 0 ? "+" : "") + num(cell.sold) + ")",
              }),
            ]),
          ]);
          if (cell.price != null) box.append(el("span", { className: "subline", textContent: num(cell.price) + "원" }));
          return box;
        }
        const price = r.cellPrice ? r.cellPrice[c.key] : null;
        const box = el("td", { className: "num" }, [
          el("div", { className: "cellnum" + (cell.sold > 0 ? "" : " zero"), textContent: cell.sold == null ? "—" : num(cell.sold) + "대" }),
        ]);
        if (price != null) box.append(el("span", { className: "subline", textContent: "최저 " + num(price) + "원" }));
        return box;
      }),
      el("td", { className: "num" }, el("b", { textContent: num(r.total) + "대" })),
    ]);
  }) : [el("tr", {}, el("td", { colSpan: cols.length + 4, className: "mute", textContent: "조건에 맞는 상품이 없어요" }))]));
}

/* ── 화면별 그리기 */
function viewHome() {
  const s = DATA.pairs.summary;
  const behind = Math.max(0, s.matched - s.cheapest);
  const risky = DATA.pairs.items.filter((i) => i.diffToMin > 0).sort((a, b) => b.diffToMin - a.diffToMin).slice(0, 5);
  return [
    el("div", { className: "page-head" }, el("div", {}, [
      el("h1", { textContent: "현황" }),
      el("div", { className: "page-sub", textContent: "한성컴퓨터와 같은 스펙 경쟁 상품의 가격·판매량을 매일 자동으로 모아요" }),
    ])),
    el("div", { className: "stats" }, [
      ["한성 상품", s.ours + "개", "경쟁 상품 " + s.rivals + "개와 비교", ""],
      ["한성이 최저가", s.cheapest + "개", "비교 가능한 " + s.matched + "개 중", "good"],
      ["경쟁사가 더 쌈", behind + "개", "가격 검토 대상", behind > 0 ? "risk" : ""],
      ["판매 순위 수집", DATA.ranking ? DATA.ranking.count + "위까지" : "-", DATA.ranking ? DATA.ranking.date + " 기준" : "", ""],
    ].map(([label, value, sub, tone]) =>
      el("div", { className: "stat" + (tone ? " " + tone : "") }, [
        el("div", { className: "label", textContent: label }),
        el("b", { textContent: value }),
        el("div", { className: "sub", textContent: sub }),
      ])
    )),
    el("div", { className: "page-head" }, el("div", {}, [
      el("h1", { style: "font-size:17px", textContent: "가격 검토가 필요한 상품" }),
      el("div", { className: "page-sub", textContent: "경쟁사 최저가보다 비싼 순서예요" }),
    ])),
    el("div", { className: "plist" }, risky.length
      ? risky.map((i) => {
          const c = productCard(i);
          c.querySelector(".pcard-main").onclick = () => { expanded = i.goodsCode; tab = "pairs";
            for (const b of document.querySelectorAll("#tabs button")) b.classList.toggle("on", b.dataset.tab === "pairs");
            render(); };
          return c;
        })
      : [el("div", { className: "empty", textContent: "경쟁사보다 비싼 상품이 없어요 👍" })]),
  ];
}

function viewPairs() {
  const s = DATA.pairs.summary;
  const behind = Math.max(0, s.matched - s.cheapest);
  return [
    el("div", { className: "page-head" }, el("div", {}, [
      el("h1", { textContent: "가격 비교" }),
      el("div", { className: "page-sub", textContent: "상품을 누르면 같은 스펙 경쟁 상품이 펼쳐져요 · 가격은 실구매가(쿠폰 적용) 기준" }),
    ])),
    el("div", { className: "controls" }, [
      el("button", { id: "fAll", className: "chip-btn on", textContent: "전체 " + s.ours, onclick: () => { filterMode = "all"; renderPairList(); } }),
      el("button", { id: "fBest", className: "chip-btn", textContent: "한성이 최저가 " + s.cheapest, onclick: () => { filterMode = "best"; renderPairList(); } }),
      el("button", { id: "fBehind", className: "chip-btn", textContent: "경쟁사가 더 쌈 " + behind, onclick: () => { filterMode = "behind"; renderPairList(); } }),
      el("select", { id: "sortBox", onchange: renderPairList }, [
        el("option", { value: "risk", textContent: "가격 차이 큰 순" }),
        el("option", { value: "pop", textContent: "인기 순위 순" }),
        el("option", { value: "price", textContent: "가격 낮은 순" }),
      ]),
      el("input", { id: "searchBox", placeholder: "상품 검색", oninput: renderPairList }),
    ]),
    el("div", { className: "plist", id: "plist" }),
  ];
}

function viewRank() {
  const sales = DATA.sales;
  if (!sales || !sales.daily) return [el("div", { className: "empty", textContent: "아직 판매량 데이터가 없어요" })];
  const hourDates = sales.hourlyDates || [];
  if (!salesDate) salesDate = hourDates[hourDates.length - 1] || "";

  return [
    el("div", { className: "page-head" }, el("div", {}, [
      el("h1", { textContent: "판매량 추이" }),
      el("div", { className: "page-sub", textContent: "시간대별 판매량과 급상승 상품을 순위로 봅니다 · 초록 줄이 한성" }),
    ])),
    el("div", { className: "controls" }, [
      el("select", {
        onchange: (e) => { salesMode = e.target.value; render(); },
      }, [
        el("option", { value: "hour", textContent: "시간대별", selected: salesMode === "hour" }),
        el("option", { value: "day", textContent: "일자별", selected: salesMode === "day" }),
      ]),
      salesMode === "hour" && hourDates.length
        ? el("select", { onchange: (e) => { salesDate = e.target.value; renderSalesTable(); } },
            [...hourDates].reverse().map((d, i) =>
              el("option", { value: d, textContent: d + (i === 0 ? " (최신)" : ""), selected: d === salesDate })))
        : el("span", { className: "mute", textContent: sales.daily.from + " ~ " + sales.daily.to }),
      el("select", { onchange: (e) => { salesBrand = e.target.value; renderSalesTable(); } }, [
        el("option", { value: "", textContent: "전체 브랜드" }),
        ...(sales.brands || []).map((b) => el("option", { value: b, textContent: b, selected: b === salesBrand })),
      ]),
      el("input", { placeholder: "상품명 검색", value: salesQuery,
        oninput: (e) => { salesQuery = e.target.value.trim().toLowerCase(); renderSalesTable(); } }),
    ]),
    el("div", { className: "panel" }, [
      el("div", { className: "panel-title" }, [
        document.createTextNode(salesMode === "hour" ? "🔥 급상승 순위 " : "📅 일자별 판매 순위 "),
        el("span", { className: "mute", id: "salesMeta" }),
      ]),
      el("div", { className: "scroll" }, el("table", {}, [el("thead", { id: "salesHead" }), el("tbody", { id: "salesBody" })])),
    ]),
  ];
}

function render() {
  const app = $("#app");
  app.className = "";
  app.replaceChildren(...(tab === "home" ? viewHome() : tab === "pairs" ? viewPairs() : viewRank()));
  if (tab === "pairs") renderPairList();
  if (tab === "rank") renderSalesTable();
}

function start(data) {
  DATA = data;
  $("#cntPairs").textContent = DATA.pairs.summary.ours;
  $("#cntRank").textContent = DATA.sales && DATA.sales.daily ? DATA.sales.daily.rows.length : "";
  $("#sideFoot").textContent = "마지막 갱신\n" + String(DATA.generatedAt).slice(0, 16).replace("T", " ") + "\n(2시간마다 갱신)";
  $("#sideFoot").style.whiteSpace = "pre-line";
  $("#lock").hidden = true;
  render();
}

/* ── 시작: 잠겨 있으면 비밀번호를 묻는다 */
(async () => {
  let payload;
  try {
    const res = await fetch("data/dashboard.json?t=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    payload = await res.json();
  } catch (e) {
    $("#app").textContent = "데이터를 불러오지 못했어요: " + e.message;
    return;
  }
  if (!payload.encrypted) return start(payload);

  // 비밀번호는 일부러 저장하지 않는다 — 창을 새로 열면 항상 다시 묻는다.
  $("#lock").hidden = false;
  $("#pw").focus();
  if (!window.crypto || !window.crypto.subtle) {
    $("#lockErr").textContent = "이 브라우저에서는 열 수 없어요 (주소가 https 인지 확인해 주세요)";
    return;
  }
  ready = true;
  const tryUnlock = async () => {
    const pw = $("#pw").value.trim();
    if (!pw) {
      $("#lockErr").textContent = "비밀번호를 입력해 주세요";
      $("#pw").focus();
      return;
    }
    $("#unlock").disabled = true;
    $("#lockErr").textContent = "여는 중…";
    // 글자가 화면에 찍힐 틈을 준 뒤 무거운 계산을 시작한다.
    // requestAnimationFrame 은 쓰지 않는다 — 탭이 뒤에 있거나 화면이 안 그려지는 상태면
    // 영영 실행되지 않아 "여는 중…"에서 멈춰 버린다(실측).
    await new Promise((r) => setTimeout(r, 30));
    try {
      const data = await decryptPayload(payload, pw);
      $("#lockErr").textContent = "";
      start(data);
    } catch (err) {
      const msg = String((err && err.name) || err);
      // 비밀번호가 틀리면 OperationError 가 난다. 그 밖의 오류는 이유를 그대로 보여준다.
      $("#lockErr").textContent = /Operation/i.test(msg)
        ? "비밀번호가 맞지 않아요"
        : "열지 못했어요: " + msg + " — 새로고침(Ctrl+Shift+R) 후 다시 시도해 주세요";
      $("#pw").select();
    } finally {
      $("#unlock").disabled = false;
    }
  };
  $("#unlock").onclick = tryUnlock;
  // 엔터는 잠금 창 어디에 포커스가 있어도 먹게 창 전체에서 받는다
  $("#lock").addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.keyCode === 13) {
      e.preventDefault();
      tryUnlock();
    }
  });
})();
</script>
